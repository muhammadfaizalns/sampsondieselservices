name: Deploy review to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Validate website and deployment builder
        run: |
          python3 scripts/audit-site.py
          python3 -m unittest discover -s tests -v
          for file in dist/components.js dist/coverage.js dist/gearbox-loader.js dist/gearbox.js dist/motion.js; do
            node --check "$file"
          done
      - name: Build review artifact
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 scripts/build-github-pages.py --site-url "$PAGES_URL"
          python3 scripts/audit-search-readiness.py --directory _site --site-url "$PAGES_URL" --mode review
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish review website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
